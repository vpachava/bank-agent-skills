name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyyaml jsonschema pytest
      - name: Run Python Unit Test Suite
        run: |
          PYTHONPATH=. pytest tests/ -v
      - name: Run Skills Lint
        run: |
          python3 scripts/skills_lint.py . || true
      - name: Run Link Lint
        run: |
          python3 scripts/links_lint.py || true
      - name: Run Staleness Check
        run: |
          python3 governance/scripts/staleness-detector.py .

  deploy-docs:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MkDocs dependencies
        run: pip install mkdocs-material mike
      - name: Deploy Docs
        run: mike deploy --update-aliases dev latest || echo "Docs deploy skipped or configured for branch"
