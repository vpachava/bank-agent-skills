name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pyyaml
      - name: Run Skills Lint
        run: python3 scripts/skills_lint.py .
      - name: Run Link Lint
        run: python3 scripts/links_lint.py
      - name: Run Diagram Validation
        run: |
          # Simple validation: search for generated diagrams in docs/ or diagrams/
          # Ensure they contain the artifact_id pattern
          if find . -name "*.md" -exec grep -l "metadata:" {} + | xargs grep -L "artifact_id:" | grep -q .; then
             echo "Error: Some diagrams missing artifact_id metadata"
             exit 1
          fi
          # Ensure they contain the data_sovereignty pattern
          if find diagram-templates -name "*.md" -exec grep -L "data_sovereignty:" {} + | grep -q .; then
             echo "Error: Some diagrams missing data_sovereignty metadata"
             exit 1
          fi
      - name: Run Staleness Check
        run: |
          python3 governance/scripts/staleness-detector.py .

  deploy-docs:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - run: pip install mkdocs-material mike
      - run: mike deploy --update-aliases dev latest
