name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff jsonschema
      - name: Lint with ruff
        run: ruff check .
      - name: Validate MCP registry
        run: |
          python - <<'PY'
          import json, sys, pathlib
          schema_path = pathlib.Path('mcp-registry-schema.json')
          if schema_path.exists():
              import jsonschema
              schema = json.load(schema_path.open())
              data = json.load(open('mcp-registry.json'))
              jsonschema.validate(instance=data, schema=schema)
          else:
              print('No schema to validate')
          PY
      - name: Run skill readiness validation
        run: python scripts/validate_skill_readiness.py
      - name: Run test suite
        run: PYTHONPATH=. pytest tests/ -v
